# Builds and deploys the DURF dashboards to GitHub Pages, following marimo's
# standard WebAssembly + GitHub Pages template:
# https://github.com/marimo-team/marimo-gh-pages-template
#
# Runs automatically on pushes to main, or can be triggered manually.

name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@v3

      - name: 🛠️ Export notebooks
        run: |
          uv run .github/scripts/build.py
          find _site -maxdepth 2

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
